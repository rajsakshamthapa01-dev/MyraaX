
name: Build APK

on:
  workflow_dispatch:
    inputs:
      render_url:
        description: "Your Render server URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Setup Gradle 7.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.5"

      - name: Configure Myraa Server URL
        env:
          RENDER_URL: ${{ inputs.render_url }}
        run: |
          python3 - <<'PY'
          import os, re, html
          from pathlib import Path

          url = os.environ["RENDER_URL"].strip().rstrip("/")

          if not url.startswith("https://"):
              raise SystemExit("Render URL must start with https://")

          file = Path(
              "Myraa/MYRAA-Native/app/src/main/res/values/strings.xml"
          )

          content = file.read_text(encoding="utf-8")

          updated, count = re.subn(
              r'(<string name="app_url">).*?(</string>)',
              lambda m: m.group(1) + html.escape(url) + m.group(2),
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("app_url string not found")

          file.write_text(updated, encoding="utf-8")
          print("Myraa server URL configured successfully")

          PY

      - name: Build Myraa APK
        run: |
          gradle -p Myraa/MYRAA-Native \
            --no-daemon assembleDebug

      - name: Upload Myraa APK
        uses: actions/upload-artifact@v4
        with:
          name: Myraa-APK
          path: Myraa/MYRAA-Native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

