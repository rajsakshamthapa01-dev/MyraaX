
name: MYRAA Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # 1. Checkout Repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Install Android SDK Packages
      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-33"
          sdkmanager "build-tools;33.0.2"

      # 5. Extract MYRAA Project
      - name: Extract MYRAA ZIP
        run: |
          if [ ! -f Myraa-ready.zip ]; then
            echo "ERROR: Myraa-ready.zip not found!"
            exit 1
          fi

          mkdir -p extracted
          unzip -oq Myraa-ready.zip -d extracted

          if [ ! -d extracted/Myraa/MYRAA-Native ]; then
            echo "ERROR: Native Android project not found!"
            find extracted -maxdepth 4 -type d
            exit 1
          fi

      # 6. Fix Gradle Repository Conflict
      - name: Fix Gradle Repository Conflict
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("extracted/Myraa/MYRAA-Native/build.gradle")

          if not path.exists():
              raise SystemExit("ERROR: Root build.gradle not found")

          content = path.read_text(encoding="utf-8")

          pattern = r'(?m)^[ \t]*repositories[ \t]*\{'
          match = re.search(pattern, content)

          if not match:
              print("No root repositories block found. Continuing.")
          else:
              start = match.start()
              brace_start = content.find("{", match.start())
              depth = 0
              end = None

              for i in range(brace_start, len(content)):
                  if content[i] == "{":
                      depth += 1
                  elif content[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit(
                      "ERROR: Could not locate repositories block end"
                  )

              content = content[:start] + content[end:]
              path.write_text(content, encoding="utf-8")

              print("Root repositories block removed successfully.")

          PY

      # 7. Setup Gradle 7.5
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5'

      # 8. Verify Gradle
      - name: Verify Gradle
        run: gradle --version

      # 9. Build APK
      - name: Build MYRAA APK
        run: |
          gradle -p extracted/Myraa/MYRAA-Native \
            --no-daemon \
            assembleDebug

      # 10. Upload APK
      - name: Upload MYRAA APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRAA-Android-APK
          path: extracted/Myraa/MYRAA-Native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
