name: Build MYRAA APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT_DIR: extracted/Myraa/MYRAA-Native
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          set -e
          ZIP=$(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found in the repository."
            ls -R . | head -n 100
            exit 1
          fi
          echo "Using ZIP: $ZIP"
          mkdir -p extracted
          unzip -q -o "$ZIP" -d extracted
          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: $PROJECT_DIR not found after extraction. Actual structure:"
            find extracted -maxdepth 4 -type d | head -n 50
            exit 1
          fi
          echo "Project files:"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools"

      - name: Set up Gradle 7.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5.1'

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          APK=$(find "$PROJECT_DIR" -name '*debug*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: No debug APK was produced."
            find "$PROJECT_DIR" -name '*.apk'
            exit 1
          fi
          echo "Found APK: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRAA-debug-apk
          path: extracted/Myraa/MYRAA-Native/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
