
name: Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      render_url:
        description: 'Myraa App URL'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Extract Myraa Project
        run: |
          mkdir -p extracted
          unzip -o Myraa-ready.zip -d extracted

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5'

      - name: Configure Myraa App URL
        if: ${{ inputs.render_url != '' }}
        env:
          RENDER_URL: ${{ inputs.render_url }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from xml.sax.saxutils import escape

          path = "extracted/Myraa/MYRAA-Native/app/src/main/res/values/strings.xml"
          url = os.environ.get("RENDER_URL", "").strip()

          if url:
              if not url.startswith("https://"):
                  raise SystemExit("URL must start with https://")

              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              replacement = (
                  '<string name="app_url">'
                  + escape(url)
                  + '</string>'
              )

              updated, count = re.subn(
                  r'<string name="app_url">.*?</string>',
                  lambda _: replacement,
                  content,
                  count=1,
                  flags=re.DOTALL
              )

              if count == 0:
                  raise SystemExit("app_url string not found in strings.xml")

              with open(path, "w", encoding="utf-8") as f:
                  f.write(updated)

              print("Myraa App URL updated successfully.")
          PY

      - name: Build Myraa APK
        run: |
          gradle -p extracted/Myraa/MYRAA-Native \
            --no-daemon assembleDebug

      - name: Upload Myraa APK
        uses: actions/upload-artifact@v4
        with:
          name: Myraa-APK
          path: extracted/Myraa/MYRAA-Native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
