
name: Build APK

"on":
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      render_url:
        description: "Myraa Render Server URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.5"

      - name: Extract Myraa ZIP
        run: |
          unzip -oq Myraa-ready.zip -d extracted
          ls -la extracted
          test -d extracted/Myraa/MYRAA-Native

      - name: Configure Render URL
        env:
          RENDER_URL: ${{ inputs.render_url || 'https://myraax-eueg.onrender.com' }}
        run: |
          python3 - <<'PY'
          import os, re, html
          from pathlib import Path

          url = os.environ["RENDER_URL"].strip().rstrip("/")
          path = Path("extracted/Myraa/MYRAA-Native/app/src/main/res/values/strings.xml")

          if not url.startswith("https://"):
              raise SystemExit("Invalid Render URL")

          content = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(<string name="app_url">).*?(</string>)',
              lambda m: m.group(1) + html.escape(url) + m.group(2),
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("app_url not found in strings.xml")

          path.write_text(updated, encoding="utf-8")
          PY

      - name: Build APK
        run: |
          gradle -p extracted/Myraa/MYRAA-Native \
            --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Myraa-APK
          path: extracted/Myraa/MYRAA-Native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
