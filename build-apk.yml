name: Build APK
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Render ka link (jaise https://myraa-xxxx.onrender.com)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.4"
      - name: Unzip project
        run: unzip -q Myraa-ready.zip -d proj
      - name: Set app link
        run: |
          URL="${{ github.event.inputs.app_url }}"
          sed -i "s|https://YOUR-APP.onrender.com|$URL|" proj/Myraa/MYRAA-Native/app/src/main/res/values/strings.xml
      - name: Build APK
        working-directory: proj/Myraa/MYRAA-Native
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Myraa-APK
          path: proj/Myraa/MYRAA-Native/app/build/outputs/apk/debug/*.apk
